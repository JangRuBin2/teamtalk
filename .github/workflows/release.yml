name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./build.sh
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "TeamTalk $TAG" --notes-file .github/release-notes.md
